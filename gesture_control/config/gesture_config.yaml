gesture_commander_node:
  ros__parameters:
    # Minimum inference confidence to accept a detection (0.0 – 1.0)
    confidence_threshold: 0.70

    # Number of consecutive frames with the same label required before
    # a command is triggered (debounce)
    stability_frames: 3

    # Minimum seconds between two successive commands (cooldown)
    command_cooldown_sec: 2.0

    # Z_joint increment per "point" gesture (radians, ~17 degrees)
    # Positive = elbow forward. Clamped to hardware limits (-119° … +169°).
    point_delta_rad: 0.3

    # gripper_gear_right_joint target positions (radians)
    # Hardware limits: 0.1 (closed) … 1.47 (fully open) — from arctos_gripper.xacro
    # SRDF named states: close=0.1, open=1.47
    gripper_open_pos: 1.47      # wide open — jaws apart to release / reach object
    gripper_closed_pos: 0.10    # closed — grip position

    # ── Servo mode ────────────────────────────────────────────────────────────
    # Set use_servo: true to use MoveIt Servo for 'point' (low latency, no planning).
    # Requires denso_moveit_servo node to be running before gesture_control launches.
    # Launch servo:  ros2 launch denso_moveit_servo denso_moveit_servo.launch.py use_sim_time:=true
    use_servo: false

    # Y_joint velocity used in servo mode (rad/s). Duration = point_delta_rad / this value.
    point_velocity_rad_s: 0.3
